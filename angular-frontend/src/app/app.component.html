<router-outlet />
@if (loader.active()) {
  <div class="global-loader" role="status" aria-live="polite">
    <div class="global-loader__spinner"></div>
    <span class="global-loader__text">Loading…</span>
  </div>
}
<div class="toast-stack" aria-live="polite">
  @for (t of toast.messages(); track t.id) {
    <div class="toast" [class.toast--success]="t.kind === 'success'" [class.toast--error]="t.kind === 'error'">
      {{ t.text }}
      <button type="button" class="toast__close" (click)="toast.dismiss(t.id)" aria-label="Dismiss">×</button>
    </div>
  }
</div>
