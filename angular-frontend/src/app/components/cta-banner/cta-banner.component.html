<section class="cta landing-section" appAnimateOnScroll>
  <div class="landing-container">
    <div class="cta__card glow-border">
      <h2 class="cta__title">Ready to create ads that actually convert?</h2>
      <p class="cta__sub">Join 500+ marketers who save hours every week with AI.</p>
      <a routerLink="/register" class="cta__btn">
        Start for Free — No credit card needed
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <p class="cta__alt muted">
        Or talk to us:
        <a [href]="supportMailto">{{ supportEmail }}</a>
      </p>
    </div>
  </div>
</section>
