<section class="landing-section" id="faq">
  <div class="landing-container">
    <h2 class="landing-section__title text-center" appAnimateOnScroll>Frequently asked questions</h2>
    <div class="faq" appAnimateOnScroll [appAnimateOnScrollDelay]="80">
      @for (item of items; track item.q; let i = $index) {
        <div class="faq__item card-dark">
          <button type="button" class="faq__q" [attr.aria-expanded]="isOpen(i)" (click)="toggle(i)">
            <span>{{ item.q }}</span>
            <span class="faq__chev" [class.faq__chev--open]="isOpen(i)">⌄</span>
          </button>
          <div class="faq__a-wrap" [@faqPanel]="panelState(i)">
            <p class="faq__a">{{ item.a }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
