<header class="nav" [class.nav--scrolled]="scrolled()" [class.nav--open]="menuOpen()">
  <div class="nav__inner">
    <a routerLink="/" class="nav__brand" (click)="menuOpen.set(false)">
      <span class="nav__logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="url(#navLogoGrad)" />
          <path
            d="M8 18L14 8L20 18"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M10 15h8" stroke="white" stroke-width="1.5" stroke-linecap="round" />
          <defs>
            <linearGradient id="navLogoGrad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#6c63ff" />
              <stop offset="1" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="nav__title">AI Ads Generator</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <button type="button" class="nav__link" [class.nav__link--active]="isActive('features')" (click)="goSection('features', $event)">
        Features
      </button>
      <button type="button" class="nav__link" [class.nav__link--active]="isActive('how-it-works')" (click)="goSection('how-it-works', $event)">
        How it works
      </button>
      <a
        routerLink="/pricing"
        class="nav__link"
        [class.nav__link--active]="isActive('pricing')"
        (click)="onPricingNav($event)"
        >Pricing</a>
      <button type="button" class="nav__link" [class.nav__link--active]="isActive('faq')" (click)="goSection('faq', $event)">
        FAQ
      </button>
    </nav>

    <div class="nav__actions">
      <a routerLink="/login" class="btn btn--ghost">Login</a>
      <a routerLink="/register" class="btn btn--accent">Start Free</a>
    </div>

    <button
      type="button"
      class="nav__burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="nav-drawer"
      aria-label="Toggle menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <div id="nav-drawer" class="nav__drawer" [class.nav__drawer--open]="menuOpen()">
    <button type="button" class="nav__drawer-link" (click)="goSection('features', $event)">Features</button>
    <button type="button" class="nav__drawer-link" (click)="goSection('how-it-works', $event)">How it works</button>
    <a routerLink="/pricing" class="nav__drawer-link" (click)="onPricingNav($event)">Pricing</a>
    <button type="button" class="nav__drawer-link" (click)="goSection('faq', $event)">FAQ</button>
    <a routerLink="/login" class="btn btn--ghost btn--block">Login</a>
    <a routerLink="/register" class="btn btn--accent btn--block">Start Free</a>
  </div>
</header>
