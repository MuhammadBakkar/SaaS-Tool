<div class="auth">
  <h1 class="auth__title">Forgot password</h1>
  <p class="auth__sub">Enter your email and we'll send a reset link if the account exists.</p>
  <form (ngSubmit)="submit()" class="form">
    <label class="field">
      <span>Email</span>
      <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
    </label>
    <button type="submit" class="btn" [disabled]="submitting()">Send link</button>
  </form>
  <p class="auth__footer"><a routerLink="/auth/login" class="link">Back to login</a></p>
</div>
