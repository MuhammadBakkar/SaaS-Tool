<div class="shell">
  <header class="shell__header">
    <nav class="shell__nav" aria-label="Main">
      <a
        routerLink="/dashboard"
        routerLinkActive="shell__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shell__link"
        >Dashboard</a
      >
      <a routerLink="/settings/profile" routerLinkActive="shell__link--active" class="shell__link">Settings</a>
    </nav>
    <button type="button" class="shell__logout" [disabled]="loggingOut()" (click)="onLogout()">
      @if (loggingOut()) {
        <span>Signing out…</span>
      } @else {
        <span>Log out</span>
      }
    </button>
  </header>
  <main class="shell__main">
    <router-outlet />
  </main>
</div>
